[workspace]
resolver = "2"
members = [
    "crates/windebloat-schema",
    "crates/windebloat-engine",
    "crates/windebloat-ipc",
    "crates/windebloat-daemon",
    "crates/windebloat-cli",
    "apps/windebloat-ui/src-tauri",
]

[workspace.package]
version = "0.9.101"
edition = "2021"
license = "MIT"
authors = ["Hari Turlapati"]
repository = "https://github.com/turlapati/WinDebloat"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
winreg = "0.52"
windows = { version = "0.58", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
